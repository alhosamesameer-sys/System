name: ARSAD Android Build
on:
  push:
    paths:
      - 'arsad/**'
      - '.github/workflows/arsad-android.yml'
  workflow_dispatch:
concurrency:
  group: arsad-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        working-directory: arsad
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.arsad --project-name arsad .
          fi
      - name: Resolve dependencies
        working-directory: arsad
        run: flutter pub get
      - name: Configure Android compile SDK 36 for app and plugins
        working-directory: arsad
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("android")
          targets = set()
          # Only app and plugin modules have an Android configuration block.
          for name in ("build.gradle", "build.gradle.kts"):
              app_gradle = root / "app" / name
              if app_gradle.exists():
                  targets.add(app_gradle)

          metadata = Path(".flutter-plugins-dependencies")
          if metadata.exists():
              data = json.loads(metadata.read_text(encoding="utf-8"))
              for plugin in data.get("plugins", {}).get("android", []):
                  plugin_android = Path(plugin["path"]) / "android"
                  if plugin_android.exists():
                      targets.update(plugin_android.rglob("build.gradle"))
                      targets.update(plugin_android.rglob("build.gradle.kts"))

          if not targets:
              raise SystemExit("No Android app or plugin Gradle files found")

          changed = []
          unresolved = []
          for path in sorted(targets):
              source = path.read_text(encoding="utf-8")
              updated = source
              updated = re.sub(r"(?m)^(\s*)compileSdkVersion\s+[^\n]+", r"\g<1>compileSdkVersion 36", updated)
              updated = re.sub(r"(?m)^(\s*)compileSdk\s*=\s*[^\n]+", r"\g<1>compileSdk = 36", updated)
              updated = re.sub(r"(?m)^(\s*)compileSdk\s+[^\n]+", r"\g<1>compileSdk 36", updated)
              if not re.search(r"(?m)^\s*compileSdk(?:Version)?(?:\s*=)?\s*36\b", updated):
                  block = re.search(r"(?m)^\s*android\s*\{", updated)
                  if block:
                      indent = re.match(r"\s*", block.group(0)).group(0) + "    "
                      updated = updated[:block.end()] + "\n" + indent + "compileSdk = 36" + updated[block.end():]
                  else:
                      unresolved.append(str(path))
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Configured compile SDK 36 in:")
          print("\n".join(changed) if changed else "(no changes required)")
          if unresolved:
              raise SystemExit("Could not configure compile SDK in: " + ", ".join(unresolved))
          PY
      - name: Remove internet permission
        working-directory: arsad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r"\s*<uses-permission(?=[^>]*android:name=\"android.permission.INTERNET\")[^>]*/>",
              "", s
          )
          if 'xmlns:tools="http://schemas.android.com/tools"' not in s:
              s = s.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"'
              )
          marker = '<application'
          if 'tools:node="remove"' not in s:
              s = s.replace(
                  marker,
                  '<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n    ' + marker,
                  1
              )
          p.write_text(s, encoding="utf-8")
          PY
      - name: Analyze Dart code
        working-directory: arsad
        run: flutter analyze
      - name: Run tests
        working-directory: arsad
        run: flutter test
      - name: Build release APK
        working-directory: arsad
        run: flutter build apk --release
      - name: Verify APK has no INTERNET permission
        working-directory: arsad
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk > /tmp/arsad-permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/arsad-permissions.txt; then
            cat /tmp/arsad-permissions.txt
            echo "INTERNET permission found in APK"
            exit 1
          fi
          echo "Verified: INTERNET permission is absent"
      - uses: actions/upload-artifact@v4
        with:
          name: arsad-release-apk
          path: arsad/build/app/outputs/flutter-apk/app-release.apk
