name: ARSAD Android Build
on:
  push:
    paths:
      - 'arsad/**'
      - '.github/workflows/arsad-android.yml'
  workflow_dispatch:
concurrency:
  group: arsad-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        working-directory: arsad
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.arsad --project-name arsad .
          fi
      - name: Configure Android compile SDK 36 for app and plugins
        working-directory: arsad
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('android')
          files = list(root.rglob('build.gradle')) + list(root.rglob('build.gradle.kts'))
          if not files:
              raise SystemExit('No Android Gradle build files found')
          changed = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              original = s
              # Flutter app and Flutter plugin projects can each set their own compile SDK.
              s = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdkVersion\s+\(?\s*34\s*\)?', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', s)
              s = re.sub(r'compileSdk\s*=\s*34\b', 'compileSdk = 36', s)
              if p.name == 'build.gradle.kts' and p.parent.name == 'app' and 'compileSdk = 36' not in s:
                  if re.search(r'compileSdk\s*=', s):
                      s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
                  else:
                      s = s.replace('android {', 'android {\n    compileSdk = 36', 1)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Configured compile SDK 36 in:', changed)
          # Fail early if a Gradle script still explicitly uses Flutter's lower compile SDK.
          leftovers = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              if re.search(r'compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|34\b)', s):
                  leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Android projects still use compile SDK 34: ' + ', '.join(leftovers))
          PY
      - name: Remove internet permission
        working-directory: arsad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<uses-permission(?=[^>]*android:name="android.permission.INTERNET")(?![^>]*tools:node="remove")[^>]*/>', '', s)
          if 'tools:node="remove"' not in s:
              s=s.replace('xmlns:android="http://schemas.android.com/apk/res/android"', 'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"')
              s=s.replace('<uses-feature', '<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n    <uses-feature', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Resolve dependencies
        working-directory: arsad
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: arsad
        run: flutter analyze
      - name: Run tests
        working-directory: arsad
        run: flutter test
      - name: Build release APK
        working-directory: arsad
        run: flutter build apk --release
      - name: Verify APK has no INTERNET permission
        working-directory: arsad
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk > /tmp/arsad-permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/arsad-permissions.txt; then
            cat /tmp/arsad-permissions.txt
            echo "INTERNET permission found in APK"
            exit 1
          fi
          echo "Verified: INTERNET permission is absent"
      - uses: actions/upload-artifact@v4
        with:
          name: arsad-release-apk
          path: arsad/build/app/outputs/flutter-apk/app-release.apk
